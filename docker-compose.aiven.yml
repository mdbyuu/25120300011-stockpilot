services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: ${DB_HOST:-mysql-31983004-markusdimasbayunta-b41b.l.aivencloud.com}
      DB_PORT: ${DB_PORT:-17739}
      DB_NAME: ${DB_NAME:-defaultdb}
      DB_USER: ${DB_USER:-avnadmin}
      DB_PASS: ${DB_PASS:?DB_PASS must be set}
      DB_SSL: ${DB_SSL:-true}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-5002}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5002/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
